name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cf-calculation-auto-generate-vmqfve
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のデプロイはキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages が未設定の場合はここで有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # ビルド不要の静的サイトなので、リポジトリ全体をそのまま公開する
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
